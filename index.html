<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>CineShop</title>
        <link rel="icon" type="image/png" href="img/Logo.png">
    </head>
    <body>
        <div class="Login_body">
            <img src="img\Logo.png" alt="CineShop" id="CineShop">
            <div class="Login_box">
                <h2>Entrar</h2>
                <form>
                    <div class="input_box">
                        <input required type="email" placeholder="Email">
                    </div>
                    <div class="input_box">
                        <input required type="password" placeholder="Senha">
                    </div>
                    <button id=EntrarBotão type="submit">Enviar</button>
                </form>
                <p><input type="checkbox"> Olá!</p>
                <div class="login_apps">
                    <p>Conectar com <img src="img/google-37.png" alt="Google">.</p>
                </div>

                <div class="Cadastrando">
                    <p>Novo por aqui? <a href="#">Cadastre-se.</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
